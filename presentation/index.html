<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>СПЛІТЛАБ — презентація до семінару</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./slides.css" />
</head>
<body>
  <div id="deck" class="deck" aria-live="polite"></div>
  <nav class="chrome">
    <button type="button" id="prev" aria-label="Попередній">←</button>
    <span id="counter"></span>
    <button type="button" id="next" aria-label="Наступний">→</button>
  </nav>
  <p class="hint">← → або пробіл · Esc — зміст · F — повний екран</p>
  <script type="module" src="./slides.js"></script>
</body>
</html>
